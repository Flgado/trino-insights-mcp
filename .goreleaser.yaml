version: 2

project_name: trino-insights-mcp

before:
  hooks:
    - go mod download
    - go mod tidy

builds:
  - id: trino-insights-mcp
    main: ./cmd
    binary: trino-insights-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Flgado/trino-insights-mcp/internal/timcp.Version={{.Version}}
      - -X github.com/Flgado/trino-insights-mcp/internal/timcp.Commit={{.Commit}}
      - -X github.com/Flgado/trino-insights-mcp/internal/timcp.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md
      - docs/**/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "New features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: "New rules"
      regexp: "^.*rule[(\\w)]*:+.*$"
      order: 2
    - title: "Other changes"
      order: 999

release:
  github:
    owner: Flgado
    name: trino-insights-mcp
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## Trino Insights MCP {{ .Version }}

    See [CHANGELOG](#changelog) below for what's new.

    ### Install

    ```bash
    # go install (latest tag, builds from source)
    go install github.com/Flgado/trino-insights-mcp/cmd@v{{ .Version }}

    # Docker (multi-arch: linux/amd64, linux/arm64)
    docker pull ghcr.io/flgado/trino-insights-mcp:{{ .Version }}
    ```

    Or grab a pre-built binary archive for your platform from the assets
    list below.

dockers:
  - image_templates:
      - "ghcr.io/flgado/trino-insights-mcp:{{ .Version }}-amd64"
      - "ghcr.io/flgado/trino-insights-mcp:latest-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Trino performance copilot via MCP"
      - "--label=org.opencontainers.image.url=https://github.com/Flgado/trino-insights-mcp"
      - "--label=org.opencontainers.image.source=https://github.com/Flgado/trino-insights-mcp"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
    goarch: amd64

  - image_templates:
      - "ghcr.io/flgado/trino-insights-mcp:{{ .Version }}-arm64"
      - "ghcr.io/flgado/trino-insights-mcp:latest-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Trino performance copilot via MCP"
      - "--label=org.opencontainers.image.url=https://github.com/Flgado/trino-insights-mcp"
      - "--label=org.opencontainers.image.source=https://github.com/Flgado/trino-insights-mcp"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/flgado/trino-insights-mcp:{{ .Version }}"
    image_templates:
      - "ghcr.io/flgado/trino-insights-mcp:{{ .Version }}-amd64"
      - "ghcr.io/flgado/trino-insights-mcp:{{ .Version }}-arm64"
  - name_template: "ghcr.io/flgado/trino-insights-mcp:latest"
    image_templates:
      - "ghcr.io/flgado/trino-insights-mcp:latest-amd64"
      - "ghcr.io/flgado/trino-insights-mcp:latest-arm64"
